<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mes Rendez-vous — OMAZA</title>
<link rel="stylesheet" href="../css/style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="header" id="header">
    <nav class="navbar">
        <a href="../index.html" class="nav-brand">
            <div class="brand-icon"><i class="fas fa-shield-alt"></i></div>
            <div class="brand-text">
                <span class="brand-name">OMAZA</span>
                <span class="brand-sub">Espace Client</span>
            </div>
        </a>
        <ul class="nav-menu" id="navMenu">
            <li><a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Accueil</a></li>
            <li><a href="rendez-vous.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Prendre RDV</a></li>
            <li><a href="mes-rendez-vous.html" class="nav-link active"><i class="fas fa-list"></i> Mes RDV</a></li>
            <li id="navUserItem"></li>
        </ul>
    </nav>
</header>

<section class="page-header">
    <div class="container">
        <h1><i class="fas fa-calendar-check"></i> Mes Rendez-vous</h1>
        <p>Historique et suivi de vos rendez-vous OMAZA</p>
    </div>
</section>

<section class="form-section">
    <div class="container">
        <div class="form-card form-card-wide">

            <h2 class="form-title">📅 Vos rendez-vous</h2>
            <p class="form-subtitle">Voici la liste de tous vos rendez-vous au Centre OMAZA</p>

            <div id="myRDV" style="display:flex; flex-direction:column; gap:14px;">
                Chargement...
            </div>

        </div>
    </div>
</section>

<script type="module" src="../js/firebase-config.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/session.js"></script>

<script type="module">
import { initSession } from "../js/session.js";
import { getMyAppointments, updateAppointmentStatus } from "../js/appointments.js";
import {
    APPOINTMENT_STATUS,
    getAppointmentStatusMeta,
    getAppointmentStatusLabel
} from "../js/statuses.js";
import { auth } from "../js/firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

initSession();

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "inscription.html";
        return;
    }

    const list = document.getElementById("myRDV");
    const rdvs = await getMyAppointments();

    if (!rdvs.length) {
        list.innerHTML = `<p style="color:var(--gray)">Vous n’avez encore aucun rendez-vous.<br>
            <a href="rendez-vous.html" class="btn btn-primary" style="margin-top:14px;">
            <i class="fas fa-calendar-alt"></i> Prendre un rendez-vous</a></p>`;
        return;
    }

    list.innerHTML = "";

    rdvs.forEach(rdv => {
        const date = rdv.date ? new Date(rdv.date).toLocaleDateString("fr-FR") : "—";
        const statusMeta = getAppointmentStatusMeta(rdv.status);
        const label = getAppointmentStatusLabel(rdv.status, true);

        const card = document.createElement("div");
        card.style.cssText = `
            border:1px solid #e9ecef;
            border-radius:12px;
            padding:16px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:white;
            box-shadow:0 2px 8px rgba(0,0,0,0.05);
        `;

        card.innerHTML = `
            <div>
                <strong>${rdv.marque} ${rdv.modele}</strong> (${rdv.categorie})<br>
                <small>Immatriculation : ${rdv.immatriculation}</small><br>
                📅 <strong>${date}</strong> à <strong>${rdv.heure}</strong> — Service : ${rdv.service}<br>
                Statut : <span style="font-weight:700; color:${statusMeta.color}">${label}</span>
            </div>
            <div>
                ${rdv.status === APPOINTMENT_STATUS.PENDING || rdv.status === APPOINTMENT_STATUS.CONFIRMED
                    ? `<button class="btn btn-secondary btn-sm" style="background:#c0392b;" data-id="${rdv.id}">❌ Annuler</button>`
                    : ""
                }
            </div>
        `;

        list.appendChild(card);
    });

    list.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", async () => {
            if (!confirm("Voulez-vous vraiment annuler ce rendez-vous ?")) return;
            const id = btn.getAttribute("data-id");
            const r = await updateAppointmentStatus(id, APPOINTMENT_STATUS.CANCELLED);
            if (r.success) window.location.reload();
            else showToast("❌ " + r.message, "error");
        });
    });

});
</script>

<script type="module">
import { showToast } from "../js/toast.js";
</script>

</body>
</html>
